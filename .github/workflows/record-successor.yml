name: Record successor experiment

on:
  workflow_dispatch:
    inputs:
      mersenne_exponent:
        description: "Target is 2^E-1; default is the largest known prime's exponent"
        required: true
        default: "136279841"
        type: string
  push:
    branches:
      - main
      - "agent/primeward-record/**"
    paths:
      - ".github/workflows/record-successor.yml"
      - "experiments/record_successor.py"
      - "tests/test_record_successor.py"

permissions:
  contents: read

concurrency:
  group: record-successor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record_target:
    name: Target probe and resource report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the analytic dependency
        run: python -m pip install -r requirements.txt
      - name: Probe the actual target with the unchanged engine
        env:
          TARGET_EXPONENT: ${{ inputs.mersenne_exponent || '136279841' }}
        run: python -B -m experiments.record_successor target --exponent "$TARGET_EXPONENT" --timeout 60 --memory-mib 1024 --output results/target.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-target-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: error

  calibration:
    name: Certified analytic calibration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the analytic dependency
        run: python -m pip install -r requirements.txt
      - name: Calculate and independently verify smaller successors
        run: python -B -m experiments.record_successor calibrate --timeout 60 --memory-mib 1024 --output results/calibration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytic-calibration-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: error
