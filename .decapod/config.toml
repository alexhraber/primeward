schema_version = "1.0.0"

[context]
declared_sources = [
    "README.md",
    "research/fast_analytic_theory.md",
]

[custody]
isolation = "worktree"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = true
diagram_style = "mermaid"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
name = "application_examples"
command = "python3.14"
args = ["-B", "-S", "-m", "applications.proof", "examples"]
description = "Run all default finite physics experiments and their checks"
required = true

[[proof.commands]]
name = "unit_tests"
command = "python3.14"
args = ["-B", "-S", "-m", "applications.proof", "unit-tests"]
description = "Run independent core and application correctness tests"
required = true

